<!doctype html><html lang="en"><meta charset="utf-8"><title>Original Bailabu motif review</title>
<style>body{margin:12px;font:16px sans-serif}.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}figure{margin:0;text-align:center}img,svg{width:100%;height:270px;object-fit:contain}figcaption{font-weight:bold}</style>
<div class="gallery"></div><script src="../assets/coloring-library.js"></script><script>
for(const template of BailabuStudio.templates.filter(t=>!t.printable&&t.id!=='blank')){
const figure=document.createElement('figure'),img=document.createElement('img'),label=document.createElement('figcaption');
img.src='../'+template.thumbnail;img.alt=template.labels.en;label.textContent=template.labels.en;figure.append(img,label);document.querySelector('.gallery').append(figure);
}
(async()=>{
for(const id of ['banana','pear']){
const def=await (await fetch('../assets/coloring/'+id+'.json')).json(),ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');
svg.setAttribute('viewBox',`0 0 ${def.width} ${def.height}`);
def.regions.forEach((region,i)=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',region.d);p.setAttribute('fill',['#ff9cb9','#3db8f5','#ffc83d','#5cc85a'][i%4]);svg.append(p)});
const ink=document.createElementNS(ns,'image');ink.setAttribute('href',def.ink);ink.setAttribute('width',def.width);ink.setAttribute('height',def.height);svg.append(ink);
const figure=document.createElement('figure'),label=document.createElement('figcaption');label.textContent=id+' — prepared regions';figure.append(svg,label);document.querySelector('.gallery').append(figure);
}document.body.dataset.ready='true';
})();
</script></html>
